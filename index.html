<style>

  --m:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--black);color:var(--text);font-family:var(--b);overflow-x:hidden}
.pad{padding-inline:clamp(16px,4vw,44px)}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3,h4{margin:0;font-family:var(--d);font-weight:800;letter-spacing:-.025em;text-wrap:balance}

/* ---------- nav (transparent overlay, Tesla-style) ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(0,0,0,.32);

.navin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-block:13px}
.logo{font-family:var(--d);font-weight:800;font-size:14px;letter-spacing:.2em;text-transform:uppercase;

.navmid{display:flex;gap:22px;align-items:center}
.navlink{font-family:var(--m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;

.navright{justify-self:end;display:flex;gap:14px;align-items:center;position:relative}
.nbtn{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;

.drop button,.drop a{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;

.drop .s{font-family:var(--m);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

.drop .lead{padding:9px 11px 3px;font-family:var(--m);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* ---------- views ---------- */
.view{display:none} .view.on{display:block}

.hstat.r{align-items:flex-end;text-align:right}

.herocta{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;

.ocap{font-family:var(--m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);text-align:center;max-width:340px}

.tag{font-family:var(--m);font-size:8px;letter-spacing:.13em;text-transform:uppercase;padding:2.5px 6px;border:1px solid;border-radius:2px;white-space:nowrap}

.tag.brief{color:var(--gold);border-color:rgba(201,162,74,.35)}

  opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .16s,transform .16s,visibility .16s}
.tile:hover .pop,.tile:focus-within .pop,.tile.open .pop{opacity:1;visibility:visible;transform:none}

.pop ul{margin:0;padding-left:14px;display:flex;flex-direction:column;gap:5px}
.pop li{font-size:11px;color:var(--mute);line-height:1.5}
.pop .more{margin-top:10px;font-family:var(--m);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ice)}

.track{height:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden}

.tmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tt{font-size:13.5px;line-height:1.35}
.tmeta{font-family:var(--m);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);display:flex;gap:9px;flex-wrap:wrap}

.addwrap{padding:13px 18px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line)}
.addrow{display:flex;gap:8px}

[hidden]{display:none!important}

 {id:'t08',t:'Translate the listings into Polish',imp:0,due:'2026-09-29',who:'claude'},
 {id:'t09',t:'Delete the 5 old tracker files in Drive, keep one',imp:0,due:'2026-09-30',who:'claude'},
 {id:'t10',t:'Ask Vinted when Pro opens in Lithuania',imp:0,due:'2026-10-01',who:'claude'}
];

const $=s=>document.querySelector(s);
const eur=n=>'€'+Math.round(n).toLocaleString('en-US');
let db=null,col=null,todos=SEED.map(s=>({...s,done:false}));

/* ---- tiles ---- */
(function(){
  const w=$('#tiles');
  P.forEach(p=>{
    const t=document.createElement('div');
    t.className='tile'; t.dataset.id=p.id;
    t.setAttribute('role','button'); t.tabIndex=0;
    t.innerHTML='<div class="th"><h3>'+p.name+'</h3><span class="tag '+p.tag+'">'+(p.tag==='live'?'Running':'Needs brief')+'</span></div>'+
      '<div class="mini">'+p.mini.map(m=>'<div><b>'+m[0]+'</b><span>'+m[1]+'</span></div>').join('')+'</div>'+
      '<div class="pop"><ul>'+p.pop.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="more">Open →</div></div>';
    const go=()=>{
      if(matchMedia('(hover:none)').matches && !t.classList.contains('open')){t.classList.add('open');return}
      location.hash=p.id;
    };
    t.addEventListener('click',go);
    t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
    w.appendChild(t);
  });
})();

/* ---- projects dropdown ---- */
(function(){
  const d=$('#projDrop');
  d.innerHTML=P.map(p=>'<button data-go="'+p.id+'">'+p.name+'<span class="s">'+(p.tag==='live'?'Running':'Brief')+'</span></button>').join('')+
    '<hr><div class="lead">Working on this project</div>'+
    '<a href="'+PROJECT_URL+'" target="_blank" rel="noopener">Open in Claude ↗<span class="s">Full project context</span></a>';
  d.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.go;d.hidden=true;$('#projBtn').setAttribute('aria-expanded','false')}));
  $('#projBtn').addEventListener('click',e=>{e.stopPropagation();d.hidden=!d.hidden;$('#projBtn').setAttribute('aria-expanded',String(!d.hidden))});
  document.addEventListener('click',e=>{if(!d.hidden&&!d.contains(e.target))d.hidden=true});
})();

/* ---- routing ---- */
function route(){
  const h=location.hash.replace('#','');
  const p=P.find(x=>x.id===h);
  if(!p){$('#v-home').classList.add('on');$('#v-proj').classList.remove('on');return}
  $('#v-home').classList.remove('on');$('#v-proj').classList.add('on');
  $('#projBody').innerHTML=
   '<div class="ptop"><h2>'+p.name+'</h2><span class="tag '+p.tag+'">'+(p.tag==='live'?'Running':'Needs brief')+'</span></div>'+
   '<div class="pstats">'+p.stats.map(s=>'<div class="pstat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>').join('')+'</div>'+
   '<div class="pcols">'+p.cols.map(c=>'<div class="pblock"><h4>'+c[0]+'</h4><ul>'+c[1].map(x=>'<li>'+x+'</li>').join('')+'</ul></div>').join('')+'</div>';
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
$('#home').addEventListener('click',()=>{location.hash='';route();window.scrollTo({top:0,behavior:'smooth'})});

/* ---- nav section links (from home or from a project page) ---- */
function goSection(id){
  const jump=()=>{const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth'})};
  if(location.hash){location.hash='';route();requestAnimationFrame(()=>requestAnimationFrame(jump))}
  else jump();
}
$('#navTiles').addEventListener('click',()=>goSection('tiles-section'));
$('#navProgress').addEventListener('click',()=>goSection('progress-section'));

/* ---- numbers ---- */
function numbers(){
  const gap=Math.max(0,PRICE-NET_TO_DATE);
  $('#roGap').textContent=eur(gap);
  $('#roBanked').textContent=eur(NET_TO_DATE);
  $('#roMonth').textContent=eur(NET_MONTH);
  $('#roNeed').textContent=eur(UNLOCK);
  $('#priceTxt').textContent=eur(PRICE)+' indicative';
  const pct=NET_MONTH/UNLOCK*100;
  const ok=NET_MONTH>=UNLOCK;
  const btn=$('#orderBtn');
  btn.classList.toggle('unlocked',ok);
  btn.disabled=!ok;
  $('#lockMsg').textContent='Not yet — '+eur(UNLOCK-NET_MONTH)+' a month short';
  $('#orderCap').textContent=ok?'Unlocked. Go and configure it.':'Unlocks at '+eur(UNLOCK)+' net profit per month. Currently at '+pct.toFixed(2)+'%.';

  const days=Math.max(0,Math.floor((new Date()-new Date(START))/864e5));
  const bars=[
   {l:'Net profit per month against the €20,000 unlock',v:NET_MONTH,m:UNLOCK,c:'gold',
    w:'This is the number that opens the Order button. Nothing else does.'},
   {l:'Banked against the car',v:NET_TO_DATE,m:PRICE,c:'',
    w:eur(NET_TO_DATE)+' of '+eur(PRICE)+'. Net profit, not revenue.'},
   {l:'Days running',v:days,m:180,c:'good',
    w:days+' days in. Time spends itself whether or not the money moves.'}
  ];
  $('#bars').innerHTML='<div style="display:flex;flex-direction:column;gap:18px">'+bars.map(b=>{
    const p=Math.max(0,Math.min(100,b.v/b.m*100));
    return '<div class="bar"><b><span>'+b.l+'</span><span>'+(p<0.1&&p>0?'<0.1':p.toFixed(1))+'%</span></b>'+
      '<div class="track"><div class="fill '+b.c+'" style="width:'+Math.max(p,0.4)+'%"></div></div><div class="why">'+b.w+'</div></div>';
  }).join('')+'</div>';

  const need=Math.round(UNLOCK/9.63);
  $('#reality').innerHTML='€20,000 net a month at the current €9.63 average sale is <b>'+need.toLocaleString('en-US')+
   ' sales a month</b> — about <b>'+Math.round(need/30)+' a day</b>, before costs. Vinted alone does not get there at this price point. '+
   'Higher average price, bundles, and the other three projects on this page are what move the bar.';
}

/* ---- to-do modal ---- */
let modal=null;
function openTodo(){
  if(modal)return;
  const host=$('#modalHost');
  const d=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  host.innerHTML='<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-label="To-do">'+
   '<div class="mhead"><h2>To-do</h2><span class="date">'+d+'</span></div>'+
   '<div class="todos" id="todos"></div>'+
   '<div class="addwrap">'+
     '<div class="addrow"><input type="text" id="tnew" placeholder="What needs doing…" autocomplete="off"><button class="b" id="tadd">Add</button></div>'+
     '<div class="addrow"><input type="date" id="tdue"><label class="opts" style="gap:6px"><input type="checkbox" id="timp"> Important</label></div>'+
     '<div class="opts"><button class="b ghost" id="tclose">Close</button><span id="sync"></span></div>'+
   '</div></div></div>';
  modal=true;
  $('#tdue').value=new Date(Date.now()+864e5).toISOString().slice(0,10);
  $('#tadd').addEventListener('click',add);
  $('#tnew').addEventListener('keydown',e=>{if(e.key==='Enter')add()});
  $('#tclose').addEventListener('click',closeTodo);
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeTodo()});
  renderTodos();
  $('#tnew').focus();
}
function closeTodo(){$('#modalHost').innerHTML='';modal=null}
addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeTodo()});
$('#openTodo').addEventListener('click',openTodo);

function renderTodos(){
  const w=$('#todos'); if(!w)return; w.innerHTML='';
  const order=[...todos].sort((a,b)=>(a.done-b.done)||(b.imp-a.imp)||String(a.due||'').localeCompare(String(b.due||'')));
  order.forEach(t=>{
    const row=document.createElement('div'); row.className='trow';
    const b=document.createElement('button'); b.type='button';
    b.className='todo'+(t.imp?' imp':'')+(t.done?' done':'');
    b.setAttribute('aria-pressed',t.done?'true':'false');
    const due=t.due?new Date(t.due).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}):'';
    b.innerHTML='<span class="tbox">'+(t.done?'✓':'')+'</span><span class="tmid"><span class="tt"></span><span class="tmeta">'+
      (t.imp?'<span class="hot">Important</span>':'<span>Normal</span>')+(due?'<span>'+due+'</span>':'')+
      '<span class="who">'+(t.who==='claude'?'Claude':'Danys')+'</span></span></span>';
    b.querySelector('.tt').textContent=t.t;
    b.addEventListener('click',()=>{t.done=!t.done;save(t);renderTodos();dot()});
    const x=document.createElement('button'); x.className='tdel'; x.type='button'; x.textContent='×'; x.title='Delete';
    x.addEventListener('click',()=>del(t));
    row.appendChild(b);row.appendChild(x);w.appendChild(row);
  });
}
function dot(){const n=todos.filter(t=>!t.done&&t.imp).length;$('#tdot').style.display=n?'inline-block':'none'}
let st=null;
function flash(s){const e=$('#sync');if(!e)return;e.textContent=s;clearTimeout(st);st=setTimeout(()=>{const g=$('#sync');if(g)g.textContent=''},1600)}
async function save(t){if(!col){flash('local only');return}
  try{await col.doc(t.id).set({t:t.t,imp:t.imp?1:0,due:t.due||'',done:!!t.done,who:t.who||'danys',ts:t.ts||Date.now()});flash('saved')}catch(e){flash('read-only')}}
async function del(t){todos=todos.filter(x=>x.id!==t.id);renderTodos();dot();
  if(!col)return;try{await col.doc(t.id).delete();flash('deleted')}catch(e){flash('read-only')}}
function add(){const i=$('#tnew');const v=i.value.trim();if(!v)return;
  const t={id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v,imp:$('#timp').checked?1:0,
    due:$('#tdue').value||'',done:false,who:'danys',ts:Date.now()};
  todos.push(t);i.value='';$('#timp').checked=false;renderTodos();dot();save(t)}

/* ---- boot ---- */
(function(){
  const tick=()=>{const n=new Date();
    $('#clock').textContent=n.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' · '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'})};
  tick(); setInterval(tick,1000);
  $('#stamp').textContent='Live · updated by Claude';
})();
numbers(); route(); dot();

(async()=>{
  try{
    const c=await claude.use('db'); if(!c)return;
    db=c; col=db.collection('todos');
    col.onSnapshot(snap=>{
      const docs=(snap&&snap.docs)||[];
      if(!docs.length)return;
      todos=docs.map(d=>({id:d.id,...(typeof d.data==='function'?d.data():d.data)}));
      renderTodos(); dot();
    });
  }catch(e){}
})();
</script>

</body></html>
